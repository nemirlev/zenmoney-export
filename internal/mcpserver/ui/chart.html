<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZenMoney finance chart</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--color-background-primary, light-dark(#ffffff, #17191d));
      --surface: var(--color-background-secondary, light-dark(#f6f7f9, #22262c));
      --text: var(--color-text-primary, light-dark(#17191d, #f4f5f7));
      --muted: var(--color-text-secondary, light-dark(#626b77, #aab1bb));
      --border: var(--color-border-secondary, light-dark(#dfe3e8, #3b424c));
      --focus: var(--color-ring-info, #3b82f6);
      --positive: #239b56;
      --negative: #dc4c4c;
      --series-0: #4f7cff;
      --series-1: #16a6a1;
      --series-2: #e58b31;
      --series-3: #a65dd4;
      --series-4: #e45c90;
      font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { padding: clamp(12px, 3vw, 24px); min-width: 260px; }
    header { display: flex; gap: 12px; align-items: start; justify-content: space-between; }
    h1 { margin: 0; font-size: clamp(1.05rem, 3vw, 1.45rem); line-height: 1.25; }
    #subtitle { color: var(--muted); margin: 5px 0 0; font-size: .9rem; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
    button {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 7px; min-height: 34px; padding: 6px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus), transparent 45%); outline-offset: 2px; }
    button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    #status { min-height: 1.25rem; color: var(--muted); margin: 14px 0 4px; font-size: .85rem; }
    #legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; font-size: .82rem; color: var(--muted); }
    .legend-item { display: inline-flex; gap: 5px; align-items: center; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; }
    #chart-wrap { position: relative; width: 100%; min-height: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    #chart { display: block; width: 100%; height: min(58vw, 440px); min-height: 300px; }
    .grid { stroke: var(--border); stroke-width: 1; }
    .axis-label { fill: var(--muted); font-size: 11px; }
    .mark { transition: opacity .12s ease; }
    .mark:hover, .mark:focus { opacity: .72; outline: none; }
    #tooltip { position: absolute; z-index: 3; pointer-events: none; max-width: 260px; background: var(--text); color: var(--bg); padding: 7px 9px; border-radius: 6px; font-size: .78rem; box-shadow: 0 5px 18px #0004; transform: translate(8px, -100%); }
    #tooltip[hidden] { display: none; }
    #table-wrap { margin-top: 12px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
    #table-wrap[hidden], #chart-wrap[hidden] { display: none; }
    .visually-hidden {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { position: sticky; top: 0; background: var(--surface); }
    .negative { color: var(--negative); }
    .empty { display: grid; place-items: center; min-height: 300px; padding: 24px; text-align: center; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .mark { transition: none; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1 id="title">Finance chart</h1><p id="subtitle"></p></div>
    <div class="controls" aria-label="View controls">
      <button id="chart-button" type="button" aria-pressed="true">Chart</button>
      <button id="table-button" type="button" aria-pressed="false">Table</button>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite">Waiting for verified report data…</div>
  <div id="legend" aria-label="Chart legend"></div>
  <section id="chart-wrap" aria-label="Interactive finance chart">
    <svg id="chart" role="img" aria-labelledby="title subtitle"></svg>
    <div id="tooltip" role="tooltip" hidden></div>
  </section>
  <section id="table-wrap" hidden aria-label="Accessible data table"><table id="table"></table></section>
</main>
<script>
(() => {
  "use strict";
  const APP_VERSION = "2026-01-26";
  const pending = new Map();
  let nextID = 1;
  let hostContext = {};
  let current = null;
  const $ = id => document.getElementById(id);
  const colors = ["var(--series-0)", "var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)"];

  function post(message) { window.parent.postMessage(message, "*"); }
  function notify(method, params = {}) { post({ jsonrpc: "2.0", method, params }); }
  function request(method, params = {}) {
    const id = nextID++;
    post({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function applyHostContext(context = {}) {
    hostContext = { ...hostContext, ...context };
    document.documentElement.dataset.theme = hostContext.theme || "";
    document.documentElement.style.colorScheme = hostContext.theme || "light dark";
    const variables = hostContext.styles && hostContext.styles.variables;
    if (variables) Object.entries(variables).forEach(([key, value]) => {
      if (typeof value === "string" && key.startsWith("--")) document.documentElement.style.setProperty(key, value);
    });
    const dimensions = hostContext.containerDimensions || {};
    if (dimensions.height) document.documentElement.style.height = "100vh";
    else if (dimensions.maxHeight) document.documentElement.style.maxHeight = dimensions.maxHeight + "px";
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (Object.prototype.hasOwnProperty.call(message, "id") && !message.method) {
      const waiter = pending.get(message.id);
      if (!waiter) return;
      pending.delete(message.id);
      message.error ? waiter.reject(new Error(message.error.message || "Host request failed")) : waiter.resolve(message.result || {});
      return;
    }
    const params = message.params || {};
    switch (message.method) {
      case "ui/notifications/tool-input":
      case "ui/notifications/tool-input-partial":
        $("status").textContent = "Preparing chart…";
        break;
      case "ui/notifications/tool-result":
        acceptResult(params);
        break;
      case "ui/notifications/host-context-changed":
        applyHostContext(params);
        if (current) render(current);
        break;
      case "ui/resource-teardown":
        post({ jsonrpc: "2.0", id: message.id, result: {} });
        break;
    }
  });

  async function initialize() {
    try {
      const result = await request("ui/initialize", {
        protocolVersion: APP_VERSION,
        appInfo: { name: "ZenMoney Finance Chart", version: "1.0.0" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }
      });
      applyHostContext(result.hostContext || {});
      notify("ui/notifications/initialized");
    } catch (error) {
      $("status").textContent = "This host did not complete MCP Apps initialization.";
    }
  }

  // MCP Apps tools/call bridge retained here for host-mediated follow-up
  // actions. This renderer intentionally does not bypass the host or call a
  // network endpoint directly.
  function callServerTool(name, args) {
    return request("tools/call", { name, arguments: args || {} });
  }

  function acceptResult(result) {
    const payload = result && result.structuredContent;
    if (!payload || typeof payload !== "object") {
      showEmpty("The tool returned no structured chart data. Use its text result instead.");
      return;
    }
    current = normalize(payload);
    render(current);
  }
  function normalize(payload) {
    const spec = payload.chartSpec || payload.spec || payload.chart || {};
    const source = payload.data || payload.dataset || payload.rows || payload.reportRows || [];
    const data = Array.isArray(source) && source.some(point => Array.isArray(point && point.values))
      ? source.map(point => Object.assign({ id: point.id, label: point.label },
          Object.fromEntries(point.values.map(value => [value.series, value.value]))))
      : source;
    const series = Array.isArray(spec.series) && spec.series.length ? spec.series : inferSeries(data, spec);
    const report = payload.report && (payload.report.spendingSummary || payload.report.cashflow || payload.report.budgetProgress || payload.report.transactions);
    return {
      title: spec.title || payload.title || "Finance chart",
      subtitle: spec.subtitle || payload.subtitle || "",
      type: spec.type || spec.chartType || "bar",
      dimension: Array.isArray(source) && source.some(point => Array.isArray(point && point.values)) ? "label" : (spec.dimension || spec.xAxis || spec.x || "label"),
      series,
      rows: Array.isArray(data) ? data : [],
      currency: payload.currency || spec.currency || (report && report.metadata && report.metadata.currency) || "",
      formatting: spec.formatting || {},
      legend: spec.legend !== false,
      tooltip: spec.tooltip !== false,
      showNegative: spec.showNegative !== false,
      tableEnabled: Boolean(spec.table && spec.table.enabled),
      authoritativeTable: payload.table && Array.isArray(payload.table.columns) && Array.isArray(payload.table.rows) ? payload.table : null,
      tableCaption: (payload.table && payload.table.caption) || (spec.table && spec.table.caption) || ""
    };
  }
  function inferSeries(rows, spec) {
    if (!rows.length) return [];
    const dimension = spec.dimension || spec.xAxis || spec.x || "label";
    return Object.keys(rows[0]).filter(k => k !== dimension && Number.isFinite(Number(rows[0][k])))
      .map(key => ({ key, name: key }));
  }
  function seriesKey(series) { return typeof series === "string" ? series : (series.key || series.field || series.id || series.value); }
  function seriesName(series) { return typeof series === "string" ? series : (series.name || series.label || seriesKey(series)); }
  function seriesFormat(series) { return typeof series === "string" ? "number" : (series.format || "number"); }
  function number(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; }
  function chartNumber(value, model) {
    const n = number(value);
    return !model.showNegative && n < 0 ? null : n;
  }
  function formatTick(value, model, series = null) {
    const formats = series ? [seriesFormat(series)] : [...new Set(model.series.map(seriesFormat))];
    const valueFormat = formats.length === 1 ? formats[0] : "number";
    const options = { maximumFractionDigits: model.formatting.maximumFractionDigits ?? 2 };
    if (valueFormat === "currency" && model.currency) { options.style = "currency"; options.currency = model.currency; }
    try {
      const formatted = new Intl.NumberFormat(hostContext.locale || undefined, options).format(number(value));
      return valueFormat === "percent" ? formatted + "%" : formatted;
    }
    catch (_) { return formatExactValue(value, valueFormat, model.currency); }
  }
  function formatExactValue(value, valueFormat, currency) {
    const text = value == null ? "" : String(value);
    if (valueFormat === "currency" && currency) return `${text}\u00a0${currency}`;
    if (valueFormat === "percent" && text !== "") return text + "%";
    return text;
  }
  function showEmpty(message) {
    $("title").textContent = "Finance chart"; $("subtitle").textContent = ""; $("legend").replaceChildren();
    $("chart").replaceChildren();
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", "50%"); text.setAttribute("y", "50%"); text.setAttribute("text-anchor", "middle"); text.setAttribute("class", "axis-label"); text.textContent = message;
    $("chart").append(text); $("status").textContent = message;
  }
  function render(model) {
    $("title").textContent = model.title; $("subtitle").textContent = model.subtitle;
    if (!model.rows.length || !model.series.length) { showEmpty("No report rows match the selected filters."); return; }
    const hasHiddenNegatives = !model.showNegative && model.rows.some(row =>
      model.series.some(series => number(row[seriesKey(series)]) < 0));
    $("status").textContent = `${model.rows.length} verified report rows` +
      (hasHiddenNegatives ? "; negative values remain available in the table" : "");
    renderLegend(model); renderTable(model); renderSVG(model);
    $("table-button").hidden = !model.tableEnabled;
    $("table-wrap").classList.toggle("visually-hidden", !model.tableEnabled);
    setMode(false);
    requestAnimationFrame(reportSize);
  }
  function renderLegend(model) {
    const legend = $("legend"); legend.replaceChildren();
    legend.hidden = !model.legend;
    if (!model.legend) return;
    model.series.forEach((series, index) => {
      const item = document.createElement("span"); item.className = "legend-item";
      const swatch = document.createElement("span"); swatch.className = "swatch"; swatch.style.background = colors[index % colors.length];
      item.append(swatch, document.createTextNode(seriesName(series))); legend.append(item);
    });
  }
  function renderTable(model) {
    const table = $("table"); table.replaceChildren();
    const caption = table.createCaption();
    caption.textContent = model.tableCaption || `${model.title} data`;
    const fallback = model.authoritativeTable;
    if (!fallback) {
      const body = table.createTBody();
      const cell = body.insertRow().insertCell();
      cell.textContent = "No authoritative table fallback was returned.";
      return;
    }
    const head = table.createTHead().insertRow();
    fallback.columns.forEach(column => { const th = document.createElement("th"); th.scope = "col"; th.textContent = column.label || column.key; head.append(th); });
    const body = table.createTBody();
    fallback.rows.forEach(row => {
      const tr = body.insertRow();
      if (row.id) tr.dataset.rowId = row.id;
      const cells = new Map((row.cells || []).map(cell => [cell.key, cell.value]));
      fallback.columns.forEach(column => {
        const td = tr.insertCell(), value = cells.get(column.key) ?? "";
        td.textContent = formatExactValue(value, column.format || "text", model.currency);
        if (/^-/.test(String(value))) td.className = "negative";
      });
    });
  }
  function svg(name, attrs = {}) { const node = document.createElementNS("http://www.w3.org/2000/svg", name); Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v)); return node; }
  function renderSVG(model) {
    const root = $("chart"); root.replaceChildren();
    const width = Math.max(root.clientWidth || 640, 320), height = Math.max(root.clientHeight || 360, 300);
    root.setAttribute("viewBox", `0 0 ${width} ${height}`);
    if (model.type === "donut") renderDonut(root, model, width, height);
    else renderCartesian(root, model, width, height);
  }
  function renderCartesian(root, model, width, height) {
    const horizontal = model.type === "horizontal_bar";
    const margin = horizontal ? {l: 110,r: 24,t: 20,b: 34} : {l: 66,r: 20,t: 20,b: 70};
    const w = width-margin.l-margin.r, h = height-margin.t-margin.b;
    const values = model.rows.flatMap(row => model.series.map(series => chartNumber(row[seriesKey(series)], model))).filter(value => value !== null);
    const stacked = model.type === "stacked_bar";
    const positiveSums = model.rows.map(row => model.series.reduce((sum, series) => {
      const value = chartNumber(row[seriesKey(series)], model); return sum + (value !== null && value > 0 ? value : 0);
    }, 0));
    const negativeSums = model.rows.map(row => model.series.reduce((sum, series) => {
      const value = chartNumber(row[seriesKey(series)], model); return sum + (value !== null && value < 0 ? value : 0);
    }, 0));
    const min = Math.min(0, ...(stacked ? negativeSums : values)), max = Math.max(0, ...(stacked ? positiveSums : values), 1), span = max-min || 1;
    const y = value => margin.t + h - ((value-min)/span)*h;
    const xValue = value => margin.l + ((value-min)/span)*w;
    for (let i=0;i<=4;i++) {
      const value = min + span*i/4, pos = horizontal ? xValue(value) : y(value);
      root.append(svg("line", horizontal ? {x1:pos,y1:margin.t,x2:pos,y2:margin.t+h,class:"grid"} : {x1:margin.l,y1:pos,x2:margin.l+w,y2:pos,class:"grid"}));
      const label = svg("text", horizontal ? {x:pos,y:height-10,"text-anchor":"middle",class:"axis-label"} : {x:margin.l-8,y:pos+4,"text-anchor":"end",class:"axis-label"}); label.textContent = formatTick(value, model); root.append(label);
    }
    if (["line","area"].includes(model.type)) return renderLines(root, model, margin, w, h, y);
    const group = w/model.rows.length, seriesWidth = stacked ? group*.66 : group*.72/model.series.length;
    model.rows.forEach((row, rowIndex) => {
      const category = String(row[model.dimension] ?? "—");
      let positive = 0, negative = 0;
      model.series.forEach((series, seriesIndex) => {
        const value = chartNumber(row[seriesKey(series)], model);
        if (value === null) return;
        const previous = value >= 0 ? positive : negative;
        if (stacked) { if (value >= 0) positive += value; else negative += value; }
        let attrs;
        if (horizontal) {
          const base = xValue(0), end = xValue(value);
          attrs = {x:Math.min(base,end), y:margin.t+rowIndex*(h/model.rows.length)+5+seriesIndex*3, width:Math.max(1,Math.abs(end-base)), height:Math.max(4,h/model.rows.length-10-model.series.length*3)};
        } else {
          const startValue = stacked ? previous : 0, endValue = stacked ? previous+value : value;
          const top = Math.min(y(startValue),y(endValue));
          attrs = {x:margin.l+rowIndex*group+group*.14+(stacked?0:seriesIndex*seriesWidth), y:top, width:Math.max(2,seriesWidth), height:Math.max(1,Math.abs(y(startValue)-y(endValue)))};
        }
        const mark = svg("rect", {...attrs, rx:2, fill:colors[seriesIndex%colors.length], class:"mark", tabindex:"0"});
        wireTooltip(mark, `${category} · ${seriesName(series)}: ${formatExactValue(row[seriesKey(series)], seriesFormat(series), model.currency)}`); root.append(mark);
      });
      const label = svg("text", horizontal ? {x:margin.l-8,y:margin.t+(rowIndex+.5)*(h/model.rows.length)+4,"text-anchor":"end",class:"axis-label"} : {x:margin.l+(rowIndex+.5)*group,y:height-48,"text-anchor":"middle",class:"axis-label",transform:`rotate(-25 ${margin.l+(rowIndex+.5)*group} ${height-48})`});
      label.textContent = category.length > 18 ? category.slice(0,17)+"…" : category; root.append(label);
    });
  }
  function renderLines(root, model, margin, w, h, y) {
    const step = model.rows.length > 1 ? w/(model.rows.length-1) : 0;
    model.series.forEach((series, seriesIndex) => {
      const segments = []; let segment = [];
      model.rows.forEach((row, i) => {
        const value = chartNumber(row[seriesKey(series)], model);
        if (value === null) { if (segment.length) segments.push(segment); segment = []; return; }
        segment.push({ x: margin.l+i*step, y: y(value) });
      });
      if (segment.length) segments.push(segment);
      segments.forEach(points => {
        const coordinates = points.map(point => `${point.x},${point.y}`).join(" ");
        if (model.type === "area") {
          const polygon = `${points[0].x},${y(0)} ${coordinates} ${points[points.length-1].x},${y(0)}`;
          root.append(svg("polygon", {points:polygon,fill:colors[seriesIndex%colors.length],opacity:".16"}));
        }
        root.append(svg("polyline", {points:coordinates,fill:"none",stroke:colors[seriesIndex%colors.length],"stroke-width":"2.5","stroke-linejoin":"round"}));
      });
      model.rows.forEach((row,i) => {
        const value = chartNumber(row[seriesKey(series)], model);
        if (value === null) return;
        const mark = svg("circle", {cx:margin.l+i*step,cy:y(value),r:4,fill:colors[seriesIndex%colors.length],class:"mark",tabindex:"0"});
        wireTooltip(mark, `${row[model.dimension] ?? "—"} · ${seriesName(series)}: ${formatExactValue(row[seriesKey(series)], seriesFormat(series), model.currency)}`); root.append(mark);
      });
    });
    model.rows.forEach((row,i) => { const label=svg("text",{x:margin.l+i*step,y:margin.t+h+22,"text-anchor":"middle",class:"axis-label"}); label.textContent=String(row[model.dimension]??"—").slice(0,12); root.append(label); });
  }
  function renderDonut(root, model, width, height) {
    const values = model.rows.map(row => Math.max(0, number(row[seriesKey(model.series[0])]))), total = values.reduce((a,b)=>a+b,0);
    if (!total) { showEmpty("No positive values are available for this donut chart."); return; }
    const cx=width/2, cy=height/2, radius=Math.min(width,height)*.31, circumference=2*Math.PI*radius;
    let offset=0;
    values.forEach((value,index) => {
      const fraction=value/total, mark=svg("circle",{cx,cy,r:radius,fill:"none",stroke:colors[index%colors.length],"stroke-width":Math.max(22,radius*.34),"stroke-dasharray":`${fraction*circumference} ${circumference}`,"stroke-dashoffset":-offset*circumference,transform:`rotate(-90 ${cx} ${cy})`,class:"mark",tabindex:"0"});
      wireTooltip(mark, `${model.rows[index][model.dimension] ?? "—"}: ${formatExactValue(model.rows[index][seriesKey(model.series[0])], seriesFormat(model.series[0]), model.currency)} (${Math.round(fraction*100)}%)`); root.append(mark); offset+=fraction;
    });
    const value=svg("text",{x:cx,y:cy+4,"text-anchor":"middle",class:"axis-label"}); value.textContent=formatTick(total,model,model.series[0]); root.append(value);
  }
  function wireTooltip(mark, text) {
    mark.setAttribute("aria-label", text);
    if (!current || !current.tooltip) return;
    const show = event => { const tip=$("tooltip"); tip.textContent=text; tip.hidden=false; const box=$("chart-wrap").getBoundingClientRect(); const point=event.touches?.[0] || event; tip.style.left=Math.max(0,(point.clientX||box.left+box.width/2)-box.left)+"px"; tip.style.top=Math.max(30,(point.clientY||box.top+box.height/2)-box.top)+"px"; };
    const hide = () => $("tooltip").hidden=true;
    mark.addEventListener("pointerenter",show); mark.addEventListener("pointermove",show); mark.addEventListener("pointerleave",hide); mark.addEventListener("focus",show); mark.addEventListener("blur",hide);
  }
  function setMode(table) {
    if (table && current && !current.tableEnabled) return;
    $("chart-wrap").hidden=table; $("table-wrap").hidden=!table;
    if (!table && current && !current.tableEnabled) $("table-wrap").hidden=false;
    $("chart-button").setAttribute("aria-pressed",String(!table)); $("table-button").setAttribute("aria-pressed",String(table));
    if (!table && current) renderSVG(current); reportSize();
  }
  $("chart-button").addEventListener("click",()=>setMode(false)); $("table-button").addEventListener("click",()=>setMode(true));
  function reportSize() { notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight) }); }
  new ResizeObserver(reportSize).observe(document.body);
  window.addEventListener("resize",()=>current&&renderSVG(current));
  initialize();
})();
</script>
</body>
</html>
